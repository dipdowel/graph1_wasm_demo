<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>My Rust + Webpack project!</title>
  <style>
    body {
      background: black;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    canvas {
      width: 100vw;
      height: 100vh;
      image-rendering: crisp-edges;
      image-rendering: pixelated;
      object-fit: contain;
    }
  </style>
</head>
<body>
<script type="module">
  import init, { greet } from './graph1_web_demo.js';
  async function run() {
    await init(); // Load the `.wasm` file generated by `wasm-pack`

    let count = 0;
    let intervalId = setInterval((a,b) => {
      if (++count === 5 ){
        clearInterval(intervalId);
      }

      greet(Math.round(Math.random()*1000).toString());
    }, 1000);


  }

  run();




</script>
</body>
</html>
