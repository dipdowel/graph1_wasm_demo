<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>My Rust + Webpack project!</title>
    <style>
      body {
        background: black;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      canvas {
        width: 100vw;
        height: 100vh;
        image-rendering: crisp-edges;
        image-rendering: pixelated;
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <canvas
      style="border: solid 0 white"
      id="myCanvas"
    ></canvas>

    <script type="module">
      // Import the WASM stuff
      import init, { init_state, update_frame } from "./graph1_web_demo.js";

      // Prepare the 2D-canvas
      const canvas = document.getElementById("myCanvas");
      const ctx = canvas.getContext("2d");

      // Count of frames in the demo
      let frame_count = 0;

      (async function () {
        // Load the WASM module
        const wasmModule = await init();

        // Initialise the inner state of the WASM module
        const initResult = init_state(0);
        const bufPointer = initResult.pointer;
        const bufSize = initResult.buf_size;
        const width = initResult.width;
        const height = initResult.height;
        // console.log("bufPtr: " + bufPointer + ", bufSize: " + bufSize);

        // // Get access to WASM memory
        // let memory = wasmModule.memory.buffer;

        // Configure dimensions of the canvas according to the WASM module's state
        canvas.style.maxWidth = `${width}px`;
        canvas.style.maxHeight = `${height}px`;
        canvas.width = width;
        canvas.height = height;

        const imageData = ctx.createImageData(width, height);

        let bufferView;
        let wasmMemory;

        function render() {
          update_frame(frame_count);

          // Re-reference the latest WASM memory buffer on each frame
          wasmMemory = wasmModule.memory.buffer;
          bufferView = new Uint8Array(wasmMemory, bufPointer, bufSize);
          imageData.data.set(bufferView);
          ctx.putImageData(imageData, 0, 0);
          frame_count++;
          requestAnimationFrame(render);
        }
        render();

      })();

    </script>
  </body>
</html>
