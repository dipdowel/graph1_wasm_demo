<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>My Rust + Webpack project!</title>
  <style>
    body {
      background: black;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    canvas {
      width: 100vw;
      height: 100vh;
      image-rendering: crisp-edges;
      image-rendering: pixelated;
      object-fit: contain;
    }
  </style>
</head>
<body>
<script type="module">
  import init, { init_module, update_frame, set_name } from './graph1_web_demo.js';
  async function run() {
    await init(); // Load the `.wasm` file generated by `wasm-pack`

    init_module("Marilyn", 0);

    let frame_count = 0;
    let intervalId = setInterval(() => {
      if (++frame_count === 6 ){
        clearInterval(intervalId);
      }

      if (frame_count === 4 ){
        set_name("Manson");
      }

      update_frame(frame_count);
    }, 1000);


  }

  run();




</script>
</body>
</html>
