[package]
name = "graph1_wasm_demo"
version = "0.1.0"
edition = "2021"

[profile.release]
#debug = false
opt-level = 's' # or 's' for size optimization with a balance between size and speed
lto=true

[dependencies]
wasm-bindgen = "0.2.95"
web-sys = { version = "0.3.56", features = ["console"] }
wasm-bindgen-futures = "0.4.45"

[lib]
crate-type = ["cdylib", "rlib"]
