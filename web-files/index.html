<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rust + WebAssembly Demo</title>
    <style>
        /* Base styles for a clean, modern look */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Overall body styling */
        body {
            background: #1e1e2e; /* Dark, muted background for easy readability */
            font-family: Arial, sans-serif;
            color: #f5f5f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        /* Styling for content container */
        #content {
            width: 60%;
            max-width: 600px;
            text-align: center;
            padding: 20px;
            background-color: #2e2e3a;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
        }

        /* Styling for buttons and dropdown */
        button,
        select {
            margin: 5px;
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            color: #ffffff;
            background-color: #4a90e2;
            transition: background-color 0.3s ease;
        }

        button:hover,
        select:hover {
            background-color: #357ab8;
        }

        /* Ensure pixel-perfect rendering by setting max dimensions */
        canvas {
            box-sizing: content-box;
            image-rendering: high-quality;
            /*image-rendering: pixelated;*/
            border: 1px solid #4a90e2;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
<!-- Main Canvas for WebAssembly Rendering -->
<canvas id="myCanvas"></canvas>

<!-- UI Controls for Demo Selection and Controls -->
<button id="restart">Restart</button>
<button id="pause">Pause</button>

<select id="demo_selector">
    <option value="0">0.0 - Intro</option>
    <option value="1">1.1 - Bouncy</option>
    <option value="2">1.2 - Bouncy with Alpha (Integer)</option>
    <option value="3">1.3 - Bouncy with Alpha (Integer vs. Float)</option>
</select>

<!-- Descriptive content for the demo -->
<div id="content">
    <h2>WebAssembly Demo</h2>
    <p>
        Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.
    </p>
</div>

<script type="module">
    // Variables for managing application state
    let isPaused = false;
    let frame_count = 0;

    // References to UI elements
    const pauseButton = document.getElementById("pause");
    const restartButton = document.getElementById("restart");
    const demoSelector = document.getElementById("demo_selector");

    let renderFunction; // Stores the render function
    let setActiveDemoFunction; // Stores WASM demo selector function

    // Set up button and selector event listeners
    demoSelector.onchange = () => {
        console.log("Changing demo to: " + demoSelector.value);
        frame_count = 0;
        if (isPaused) togglePauseState(); // Resume if paused
        setActiveDemoFunction(parseInt(demoSelector.value));
    };

    restartButton.onclick = () => {
        console.log("Restarting...");
        frame_count = 0;
        if (isPaused) togglePauseState(); // Resume if paused
    };

    pauseButton.onclick = () => {
        togglePauseState();
    };

    // Toggles between pause and resume states
    function togglePauseState() {
        isPaused = !isPaused;
        pauseButton.innerText = isPaused ? "Resume" : "Pause";
        if (!isPaused) requestAnimationFrame(renderFunction); // Resume animation
    }

    // WebAssembly Initialization and Rendering Setup
    import init, { init_state, update_frame, set_active_demo } from "./graph1_web_demo.js";

    const canvas = document.getElementById("myCanvas");
    const ctx = canvas.getContext("2d");

    async function run() {
        // Load and initialize the WebAssembly module
        const wasmModule = await init();
        const initResult = init_state(0);

        // Destructure to get canvas dimensions from WASM
        const { pointer: bufPointer, buf_size: bufSize, width, height } = initResult;

        // Configure pixel-perfect rendering by setting max and actual dimensions
        canvas.style.maxWidth = `${width}px`;
        canvas.style.maxHeight = `${height}px`;
        canvas.width = width;
        canvas.height = height;

        const imageData = ctx.createImageData(width, height);

        // Set global WASM-related functions
        setActiveDemoFunction = set_active_demo;

        // Main render loop
        function render() {
            if (isPaused) return;

            update_frame(frame_count);
            const bufferView = new Uint8Array(wasmModule.memory.buffer, bufPointer, bufSize);

            imageData.data.set(bufferView);
            ctx.putImageData(imageData, 0, 0);

            frame_count++;
            requestAnimationFrame(render);
        }

        renderFunction = render; // Store render function globally
        render();
    }

    // Start the WebAssembly and rendering process
    run();
</script>
</body>
</html>
