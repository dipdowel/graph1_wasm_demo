<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>My Rust + Webpack project!</title>
  <style>
    body {
      background: black;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    canvas {
      width: 100vw;
      height: 100vh;
      image-rendering: crisp-edges;
      image-rendering: pixelated;
      object-fit: contain;
    }
  </style>
</head>
<body>

<canvas style="border: solid 1px lime;" id="myCanvas" width="640" height="240"></canvas>


<script type="module">

  // Assuming you already have your wasm module loaded and bufferView is a Uint8Array
  const canvas = document.getElementById('myCanvas');
  const ctx = canvas.getContext('2d');

  // Create an ImageData object
  // Each pixel needs 4 bytes: R, G, B, and A (Alpha channel)
  const imageData = ctx.createImageData(640, 240);

  import init, { init_state, update_frame, set_name } from './graph1_web_demo.js';
  async function run() {
    const wasmModule = await init(); // Load the `.wasm` file generated by `wasm-pack`

    // TODO: rename to `init_state()`
    const initResult = init_state("Marilyn", 0);

    const bufPointer = initResult.pointer;
    const bufSize = initResult.buf_size;
    const width = initResult.width;
    const height = initResult.height;

    let memory =wasmModule.memory.buffer;


    canvas.style.maxWidth = `${width}px`;
    canvas.style.maxHeight = `${height}px`;

    console.log("bufPtr: " + bufPointer + ", bufSize: " + bufSize);

    let frame_count = 0;

    let intervalId = setInterval(() => {
      if (++frame_count === 6 ){
        clearInterval(intervalId);
      }

      if (frame_count === 4 ){
        set_name("Manson");
      }

      update_frame(frame_count);



      const bufferView = new Uint8Array(memory, bufPointer, bufSize);

      // Copy bufferView to imageData.data
      imageData.data.set(bufferView);

      // Render image to the canvas
      ctx.putImageData(imageData, 0, 0);


    }, 1000);


  }

  run();




</script>
</body>
</html>
