<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Graph1 Rust / WASM Demos</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <!-- Prism.js for syntax highlighting -->
    <link href="prism-tomorrow.css" rel="stylesheet" />
    <script src="prism.min.js"></script>
    <script src="prism-rust.min.js"></script>

    <!-- Local Showdown library for Markdown to HTML conversion -->
    <script src="showdown.min.js"></script>

    <link href="default.css" rel="stylesheet" />
<!--    <link href="wave.css" rel="stylesheet" />-->
<!--    <link href="mobile.css" rel="stylesheet" />-->

  <!-- Theme selector  -->
    <link href="theme-selector/theme-selector.css" rel="stylesheet" />
    <script defer src="theme-selector/theme-selector.js"></script>

  </head>
  <body>
    <canvas id="myCanvas"></canvas>

    <div class="button-container" >
      <button id="restart" style="margin-left: 0px" >🔄 Restart</button>
        <button id="open-theme-selector-button"><div class="eye-icon"></div></button>
      <button id="pause">⏸️ Pause</button>

    </div>

    <select id="demo_selector"></select>
    <div id="top-page-navigation"></div>
<!--===[ THEME SELECTOR START ]===-->

    <div id="theme-overlay" class="theme-overlay">

      <div class="theme-options-container">
        <h2> My eyes... </h2>
          <p>Select a color theme:</p>
        <label class="theme-label">
          <input type="radio" name="theme" value="wave"> CyberWave
        </label>
        <label class="theme-label">
          <input type="radio" name="theme" value="dark"> Dark
        </label>
        <label class="theme-label">
          <input type="radio" name="theme" value="light"> Light
        </label>
        <button id="close-theme-selector-button">Cancel</button>
      </div>
    </div>

    <!--===[ THEME SELECTOR END ]===-->
    <div id="content"></div>

    <script type="module">
      let isPaused = false;
      let frame_count = 0;
      const pauseButton = document.getElementById("pause");
      const restartButton = document.getElementById("restart");
      const demoSelector = document.getElementById("demo_selector");
      const contentContainer = document.getElementById("content");

      let renderFunction;
      let setActiveDemoFunction;

      showdown.setFlavor('github');
      // Initialize Showdown Markdown converter
      const converter = new showdown.Converter({
        strikethrough: true, tables: true,
        tasklists: true,
        // simpleLineBreaks: true,
        openLinksInNewWindow: true,
        emoji:true,
      });


      function padNumber(num) {
        return num.toString().padStart(3, "0");
      }


      // ========== [Navigation configuration] =========================================================================
      const demos = [
        { value: "0", label: "Intro" },
        { value: "1", label: "Basic concepts pt.1" },
        { value: "2", label: "Basic concepts pt.2" },
        { value: "3", label: "Basic concepts pt.3" },
        { value: "4", label: "User data and animation" },
        { value: "5", label: "Colors: alpha blending" },
        { value: "6", label: "Colors: desaturation" },
        { value: "7", label: "Shapes" },
        { value: "8", label: "Polygons, stars, gradients" },
        { value: "9", label: "Lines" },
        { value: "10", label: "Quadrants" },
        { value: "11", label: "Curves" },
        { value: "999", label: "Test card" }
      ];

      const isMobile = window.matchMedia('(max-width: 768px)').matches;



        // Populate the <select /> element
      demos.forEach(demo => {
        const option = document.createElement("option");
        option.value = demo.value;
        const numPrefix = padNumber(demo.value);
        option.textContent = `${numPrefix} - ${demo.label}`;
        demoSelector.appendChild(option);
      });

      function createNavigationLinks() {
        const urlParams = new URLSearchParams(window.location.search);
        const currentDemo = parseInt(urlParams.get("demo") || "0", 10); // Default to 0 if no demo param

        const currentIndex = demos.findIndex(demo => parseInt(demo.value) === currentDemo);
        const currentDemoValue = demos[currentIndex].value; // Get current demo value

        // Function to handle link clicks
        const handleNavLinkClick = async (event, demoValue) => {
          event.preventDefault(); // Prevent full page reload
          const fileToLoad = getDocUrl(demoValue);
          await loadMarkdownContent(fileToLoad, parseInt(demoValue));
          demoSelector.value = demoValue; // Update the dropdown to match
        };

        // --- Function to build navigation content ---
        // This avoids duplicating the logic for top and bottom navs
        const buildNavContent = (container) => {
          container.innerHTML = ""; // Clear previous content
          container.classList.add('page-navigation-container'); // Add class for Flexbox styling

          // Create elements for prev, separator, and next
          const prevSpan = document.createElement("span");
          prevSpan.classList.add('nav-prev');
          const separatorSpan = document.createElement("span");
          separatorSpan.classList.add('nav-separator');
          const nextSpan = document.createElement("span");
          nextSpan.classList.add('nav-next');

          // --- Previous Link ---
          if (currentIndex > 0) {
            const prevDemo = demos[currentIndex - 1];
            const prevLink = document.createElement("a");
            prevLink.href = `/?demo=${prevDemo.value}`;
            // Use non-breaking spaces (&nbsp;) around arrows for slight visual padding
            prevLink.innerHTML = `◄◄&nbsp;${isMobile ? padNumber(prevDemo.value) : `${prevDemo.label} - ${padNumber(prevDemo.value)}`}`;
            prevLink.addEventListener('click', (event) => handleNavLinkClick(event, prevDemo.value));
            prevSpan.appendChild(prevLink);
          } else {
            prevSpan.innerHTML = "&nbsp;"; // Non-breaking space to maintain height/layout
          }

          // --- Separator (Current Demo Number) ---
          separatorSpan.textContent = `| ${padNumber(currentDemoValue)} |`;

          // --- Next Link ---
          if (currentIndex < demos.length - 1) {
            const nextDemo = demos[currentIndex + 1];
            const nextLink = document.createElement("a");
            nextLink.href = `/?demo=${nextDemo.value}`;
            // Use non-breaking spaces (&nbsp;) around arrows
            nextLink.innerHTML = `${isMobile ? padNumber(nextDemo.value) : `${padNumber(nextDemo.value)} - ${nextDemo.label}`}&nbsp;►►`;
            nextLink.addEventListener('click', (event) => handleNavLinkClick(event, nextDemo.value));
            nextSpan.appendChild(nextLink);
          } else {
            // Add placeholder content or leave empty
            nextSpan.innerHTML = "&nbsp;";
          }

          // Append all parts to the container
          container.appendChild(prevSpan);
          container.appendChild(separatorSpan);
          container.appendChild(nextSpan);
        };


        // --- Apply to Top and Bottom Containers ---
        const navContainerBottom = document.getElementById("bottom-page-navigation");
        const navContainerTop = document.getElementById("top-page-navigation");

        buildNavContent(navContainerBottom);
        buildNavContent(navContainerTop); // Build content separately for top nav
      }



      //================================================================================================================


      /**
       * Function to load, convert, and display Markdown content with syntax highlighting.
       * Also updates the URL with the current content file.
       * @param {string} file - Path to the Markdown file.
       * @param {number} demoIndex - Index for the WASM module demo.
       */
      async function loadMarkdownContent(file, demoIndex) {
        try {
          const response = await fetch(file);
          if (response.ok) {
            const markdownContent = await response.text();
            const htmlContent = converter.makeHtml(markdownContent);
            contentContainer.innerHTML = htmlContent;

            // Apply syntax highlighting with Prism.js
            Prism.highlightAll();

            // Update the URL to reflect the current file, for bookmarking
            const newUrl = `${window.location.pathname}?demo=${demoIndex}`;
            // history.replaceState(null, "", newUrl);
            history.pushState(null, "", newUrl);

            // Call WASM module to set active demo
            setActiveDemoFunction(demoIndex);
            resetFrameCount();

            // Generate the navigation links
            createNavigationLinks();

          } else {
            console.error(
              "Error loading Markdown content:",
              response.statusText
            );
          }
        } catch (error) {
          console.error("Failed to fetch Markdown content:", error);
        }
      }

      function getDocUrl(demoIndex) {
        return `docs/content${padNumber(demoIndex)}.md`;
      }

      /**
       * Handles demo selection changes from the dropdown.
       * Sets the active demo in the WASM module and loads corresponding Markdown content.
       */
      demoSelector.onchange = async function () {
        const selectedValue = this.value;
        const fileToLoad = getDocUrl(selectedValue);
        await loadMarkdownContent(fileToLoad, parseInt(selectedValue));
      };

      /**
       * Resets the frame count to 0 and resumes the animation if paused.
       */
      function resetFrameCount() {
        frame_count = 0;
        if (isPaused) {
          togglePauseState();
        }
      }

      /**
       * Restarts the current demo and resets the frame count.
       */
      restartButton.onclick = () => {
        console.log("Restarting...");
        resetFrameCount();
      };

      /**
       * Toggles between pause and resume states for the animation.
       */
      pauseButton.onclick = () => {
        togglePauseState();
      };

      /**
       * Toggles the pause state of the animation and updates button text.
       */
      function togglePauseState() {
        isPaused = !isPaused;
        pauseButton.innerText = isPaused ? "▶️ Play" : "⏸️ Pause";
        if (!isPaused) {
          requestAnimationFrame(renderFunction);
        }
      }

      // Import and initialize WebAssembly module functions
      import init, {
        init_state,
        update_frame,
        set_active_demo,
      } from "./graph1_web_demo.js";
      const canvas = document.getElementById("myCanvas");
      const ctx = canvas.getContext("2d");

      async function run() {
        const wasmModule = await init();
        const initResult = init_state(0);
        const {
          pointer: bufPointer,
          buf_size: bufSize,
          width,
          height,
        } = initResult;

        canvas.style.maxWidth = `${width}px`;
        canvas.style.maxHeight = `${height}px`;
        canvas.width = width;
        canvas.height = height;

        const imageData = ctx.createImageData(width, height);
        setActiveDemoFunction = set_active_demo;

        const alphaThreshold = 25;

        /**
         * Applies a CRT-style glow effect to the canvas using the average canvas color.
         */
        function applyGlowEffect(pixel_stats) {
          const {
            average_red,
            average_green,
            average_blue,
            average_intensity,
          } = pixel_stats;

          let glowColor;
          // Supress the glow effect if the average colors are too dark
          if (
            average_red < alphaThreshold &&
            average_green < alphaThreshold &&
            average_blue < alphaThreshold
          ) {
            glowColor = "rgba(0,0,0,0)";
          } else {
            glowColor = `rgba(${average_red}, ${average_green}, ${average_blue}, ${average_intensity})`;
          }

          canvas.style.boxShadow = `
                0 0 20px ${glowColor},
                0 0 40px ${glowColor},
                inset 0 0 10px ${glowColor},
                inset 0 0 20px ${glowColor}`;
        }


        // Throttle the framerate (just in case, if someone has a too good of a computer
        let lastTimestamp = 0;
        let maxFPS = 120;
        let period = 1000 / maxFPS; // ms for each frame


        /**
         * Main rendering function, updates the canvas content, applies glow effect, and increments frame count.
         */
        function render(timestamp) {
          requestAnimationFrame(render);
          if (isPaused) return;

          // skip if period ms hasn't passed since last frame
          if (timestamp - lastTimestamp < period) return;

          lastTimestamp = timestamp;

          const pixel_stats = update_frame(frame_count);

          const bufferView = new Uint8Array(
            wasmModule.memory.buffer,
            bufPointer,
            bufSize
          );
          imageData.data.set(bufferView);
          ctx.putImageData(imageData, 0, 0);

          applyGlowEffect(pixel_stats);

          frame_count++;

        }

        renderFunction = render;

        // Load initial content based on URL parameter
        const urlParams = new URLSearchParams(window.location.search);
        const demoParam = urlParams.get("demo");
        const initialDemo = demoParam ? parseInt(demoParam) : 0;
        demoSelector.value = initialDemo;
        await loadMarkdownContent(getDocUrl(initialDemo), initialDemo);
        render();
      }

      window.addEventListener('popstate', function() {
        const params = new URLSearchParams(window.location.search);
        const demo = params.get('demo');

        if (demo) {
          demoSelector.value = demo;
          demoSelector.dispatchEvent(new Event('change'));
        }
      });


      run();
    </script>
    <footer>
      <div id="bottom-page-navigation"></div>
      <hr />
      Graph1, a Rust graphic library | <a href="https://graph1.codument.com">graph1.codument.com</a> | All rights reserved
    </footer>
  </body>
</html>
